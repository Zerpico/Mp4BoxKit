name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Restore
        run: dotnet restore src/Mp4BoxKit/Mp4BoxKit.csproj

      - name: Build
        run: dotnet build src/Mp4BoxKit/Mp4BoxKit.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/Mp4BoxKit/Mp4BoxKit.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Install FFmpeg CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install coverage collector
        run: dotnet tool install --global dotnet-coverage

      - name: Test
        run: >
          dotnet coverage collect
          -f cobertura
          -o test-results/coverage.cobertura.xml
          'dotnet test Mp4BoxKit.slnx -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results'

      - name: Publish Test Results
        id: test-results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.trx
          check_name: Test Results
          comment_mode: off
          job_summary: true
          json_file: test-results/test-results.json

      - name: Coverage summary
        if: always() && hashFiles('test-results/coverage.cobertura.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: test-results/coverage.cobertura.xml
          badge: true
          format: markdown
          output: file

      - name: Append coverage to job summary
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Test badge
        if: github.ref == 'refs/heads/master' && vars.GIST_ID != '' && secrets.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: tests-badge.json
          label: Tests
          message: "${{ fromJSON(steps.test-results.outputs.json).passed }} passing"
          color: green
