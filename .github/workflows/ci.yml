name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Restore
        run: dotnet restore src/Mp4BoxKit/Mp4BoxKit.csproj

      - name: Build
        run: dotnet build src/Mp4BoxKit/Mp4BoxKit.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/Mp4BoxKit/Mp4BoxKit.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: tests/Mp4BoxKit.Tests/Mp4BoxKit.Tests.csproj
          - name: inspection
            project: tests/Mp4BoxKit.Inspection.Tests/Mp4BoxKit.Inspection.Tests.csproj
          - name: ffmpeg
            project: tests/Mp4BoxKit.FFmpeg.Tests/Mp4BoxKit.FFmpeg.Tests.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Install FFmpeg CLI
        if: matrix.name == 'ffmpeg'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Test
        run: >
          dotnet test ${{ matrix.project }} -c Release --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Publish Test Results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()   # публикуем даже если тесты упали
        with:
          files: test-results/**/*.trx
          check_name: Test Results (${{ matrix.name }})
          comment_mode: off     # комментарий в PR не нужен
          job_summary: true     # сводка на странице запуска workflow (Actions -> run -> Summary)
          json_file: test-results/test-results.json  # Сохраняем JSON для плашки

      # Генерируем и обновляем плашку только на master ветке и только для одного проекта, 
      - name: Create Test Badge
        if: matrix.name == 'core' && github.ref == 'refs/heads/master' && always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}  # ← ID вашего публичного Gist
          filename: tests-badge.json
          label: Tests
          message: "${{ fromJSON(steps.test-results.outputs.json).passed }} passing"
          color: green
