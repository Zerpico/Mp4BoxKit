name: Release

on:
  push:
    branches: ["release/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  draft:
    name: Build and draft release
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Install FFmpeg CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: |
          set -e
          for p in tests/*/*.csproj; do
            name=$(basename "$p" .csproj)
            echo "::group::$name"
            dotnet test "$p" -c Release \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory test-results
            echo "::endgroup::"
          done

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.trx
          check_name: Release Test Results
          comment_mode: off
          job_summary: true

      - name: Pack
        run: dotnet pack src/Mp4BoxKit/Mp4BoxKit.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Read version
        id: version
        run: |
          VERSION=$(dotnet msbuild src/Mp4BoxKit/Mp4BoxKit.csproj -getProperty:Version -nologo)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия из csproj: $VERSION"

      - name: Check tag is free
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::Тег v${{ steps.version.outputs.version }} уже существует. Поднимите <Version> в src/Mp4BoxKit/Mp4BoxKit.csproj."
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/*.nupkg

  nuget:
    name: Publish to NuGet
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ github.event.release.tag_name }}" --pattern "*.nupkg" --dir artifacts
          ls -l artifacts

      - name: Verify NUGET_USER secret
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Secret NUGET_USER не задан. Добавьте имя пользователя nuget.org в Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Не удалось получить временный ключ NuGet. Проверьте политику Trusted Publishing на nuget.org."
            exit 1
          fi
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
