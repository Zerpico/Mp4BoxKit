name: Publish NuGet

# Запускается только после успешного завершения CI на master.
# В PR этот workflow вообще не появляется — его триггер не срабатывает.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read        # нужно для скачивания артефакта из другого запуска workflow
  id-token: write      # нужно для OIDC -> временный ключ nuget.org

jobs:
  publish:
    name: Publish NuGet
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Скачиваем артефакт nuget-package из завершившегося CI-запуска.
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify NUGET_USER secret
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Secret NUGET_USER не задан. Добавьте имя пользователя nuget.org в Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Не удалось получить временный ключ NuGet. Проверьте политику Trusted Publishing на nuget.org."
            exit 1
          fi
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate